<div class="sidebar-menu-root">
  <button
    type="button"
    class="sidebar-menu__trigger"
    [class.sidebar-menu__trigger--open]="menuOpen"
    aria-label="Abrir o cerrar menú"
    [attr.aria-expanded]="menuOpen"
    aria-controls="sidebar-menu-panel"
    (click)="toggleMenu()"
  >
    <span class="sidebar-menu__hamburger-bar"></span>
    <span class="sidebar-menu__hamburger-bar"></span>
    <span class="sidebar-menu__hamburger-bar"></span>
  </button>

  <div
    class="sidebar-menu__backdrop"
    [class.sidebar-menu__backdrop--visible]="menuOpen"
    aria-hidden="true"
    (click)="closeMenu()"
  ></div>

  <aside
    id="sidebar-menu-panel"
    class="sidebar-menu__panel"
    [class.sidebar-menu__panel--open]="menuOpen"
    aria-label="Menú de proyectos"
    [attr.aria-hidden]="!menuOpen"
  >
    <div class="sidebar-menu__header">
      <a
        routerLink="/welcome"
        class="sidebar-menu__title"
        (click)="closeMenu()"
        aria-label="Ir a Welcome"
      >
        NOSMAD
      </a>
    </div>
    <nav class="sidebar-menu__nav">
      <a routerLink="/random-roulette" routerLinkActive="sidebar-menu__nav-item--active" class="sidebar-menu__nav-item" (click)="closeMenu()">
        <span class="sidebar-menu__nav-icon" aria-hidden="true">🎡</span>
        <span>Random Roulette</span>
      </a>
      <a routerLink="/grades-viewer" routerLinkActive="sidebar-menu__nav-item--active" class="sidebar-menu__nav-item" (click)="closeMenu()">
        <span class="sidebar-menu__nav-icon" aria-hidden="true">📊</span>
        <span>Grades Viewer</span>
      </a>
      <a routerLink="/parking-status" routerLinkActive="sidebar-menu__nav-item--active" class="sidebar-menu__nav-item" (click)="closeMenu()">
        <span class="sidebar-menu__nav-icon" aria-hidden="true">🅿️</span>
        <span>Parking Status</span>
      </a>
      <a routerLink="/emojipedia" routerLinkActive="sidebar-menu__nav-item--active" class="sidebar-menu__nav-item" (click)="closeMenu()">
        <span class="sidebar-menu__nav-icon" aria-hidden="true">😁</span>
        <span>Emojipedia</span>
      </a>
    </nav>
  </aside>
</div>
